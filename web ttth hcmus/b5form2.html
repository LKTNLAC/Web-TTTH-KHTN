<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/all.css">
        <link rel="stylesheet" href="css/grid.css">
        <link rel="stylesheet" href="css/form.css">
    </head>
    <body>
        <div class="container bg-form">
            <div class="bg-white">
                <div class="row">
                    <div class="col-5 form-login">
                        <h1 class="form-title">Login</h1>
                        <p class="text-label my-3">Doesn't have an account yet? <a href="#" class="text-link">SignUp</a> </p>
                        <label class="text-label">Email Address</label>
                        <input type="text" placeholder="Your Email" class="form-control">
                        <label class="text-label">Password</label>
                        <a href="#" class="text-link d-right">Forgot Password</a>
                        <input type="password" placeholder="Your Password" class="form-control">
                        <input type="checkbox">
                        <label class="text-label">Remember me</label>
                        <button class="btn-signin">Sign in</button>
                        <div class="row">
                            <div class="col-4 line"></div>
                            <div class="col-4">
                                <p class="text-label text-center">or login with</p>
                            </div>
                            <div class="col-4 line"></div>
                            <div class="col-6 ps-0">
                                <a href="#" class="btn-link btn-red"><i class="fa-brands fa-google"></i>Google</a>
                            </div>
                            <div class="col-6 pe-0">
                                <a href="#" class="btn-link btn-blue"><i class="fa-brands fa-facebook"></i>Facebook</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-7 form-img">
                        <img src="image/hinh.jpg" alt="" class="w-100">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
